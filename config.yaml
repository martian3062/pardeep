# Pardeep_Self configuration
# Names that identify YOU in chat exports (as they appear in WhatsApp export lines).
# Add every variant WhatsApp ever used for you (e.g. "Pardeep", "Pardeep Kumar", "You").
me_names:
  - Pardeep
  - Gen2
  # newer exports carry the Gurmukhi spelling of his name
  - ਪਰਦੀਪ

whatsapp:
  # India-style dates (dd/mm/yy). Parser auto-detects when possible; this is the fallback.
  dayfirst: true

transcription:
  # large-v3 handles Punjabi/Hindi phone audio far better than large-v3-turbo
  # (turbo is distilled and hallucinated repetition loops on ~17% of segments)
  model: large-v3
  # null = auto-detect language per file (handles Hindi/English code-switching)
  language: null

diarization:
  # Gated models: accept terms on huggingface.co for BOTH
  # pyannote/speaker-diarization-3.1 and pyannote/segmentation-3.0,
  # then put HF_TOKEN=... in .env
  model: pyannote/speaker-diarization-3.1
  embedding_model: pyannote/wespeaker-voxceleb-resnet34-LM
  # cosine similarity vs your enrolled voice; below this no speaker is labeled 'me'
  similarity_threshold: 0.40
  # consecutive same-speaker segments closer than this merge into one message
  merge_gap_sec: 2.0
  # voice notes shorter than this are skipped during enrollment (bad embeddings)
  min_enroll_sec: 3.0
  max_enroll_files: 150

tts:
  # N longest voice notes copied to tts_reference_dir for voice cloning
  reference_clips: 12

dataset:
  # prior turns kept as context before each of your replies
  context_turns: 6
  min_words: 2
  # merged call utterances run long (84 words avg); keep them
  max_words: 400
  max_per_conversation: 400
  eval_fraction: 0.05
  # Video audio proved to be forwarded entertainment (song lyrics, Korean drama,
  # dubbed TV dialogue) that the voice fingerprint mislabelled as his. Kept in
  # the store, kept out of training.
  exclude_sources: [video]

# Model ids live here, not in code. Providers retire ids on their own schedule,
# and a hardcoded one becomes a 404 months later that reads like "the backend is
# down" rather than "the name changed" — so they belong with the other constants.
models:
  # Cloud reply backends (src/twin/router.py). Only ever see the persona card
  # plus the snippets retrieval already chose.
  claude: claude-sonnet-5
  openai: gpt-4.1
  # Batch identity extraction samples the corpus, so it gets the stronger model.
  extract: claude-opus-4-5
  # ElevenLabs voice model — the one path that uploads audio (src/voice/tts.py).
  tts: eleven_v3
  ollama_url: http://127.0.0.1:11434

paths:
  db: data/processed/messages.db
  tts_reference_dir: data/processed/tts_reference
  voice_profile: data/processed/me_voice.npy
