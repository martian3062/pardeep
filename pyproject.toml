[project]
name = "pardeep-self"
version = "0.1.0"
description = "Pardeep_Self — personal digital twin: ingestion, memory, voice, active learning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]
transcribe = ["faster-whisper>=1.1"]
diarize = [
    "pyannote-audio>=3.3",
    "huggingface-hub<1.0",  # pyannote 3.x still uses the removed use_auth_token API
    "torch>=2.4,<2.7",
    "torchaudio>=2.4,<2.7",
]

[tool.uv]
package = false
default-groups = ["dev", "transcribe", "diarize"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
