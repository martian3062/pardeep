[project]
name = "pardeep-self"
version = "0.1.0"
description = "Pardeep_Self — personal digital twin: ingestion, memory, voice, active learning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]
transcribe = ["faster-whisper>=1.1"]
memory = [
    "lancedb>=0.15",
    "sentence-transformers>=3.0",
]
diarize = [
    "pyannote-audio>=3.3",
    "huggingface-hub<1.0",  # pyannote 3.x still uses the removed use_auth_token API
    "torch>=2.4,<2.7",
    "torchaudio>=2.4,<2.7",
]
vision = [
    "transformers>=4.57",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",  # 4-bit, so a 4B VLM fits the 6GB laptop GPU
    "pillow>=10.0",
    "torchvision>=0.19,<0.22",  # VLM processors import it even for still images
]

[tool.uv]
package = false
# every group is default: otherwise `uv run --group X` uninstalls the others,
# which silently broke the memory index mid-build once
default-groups = ["dev", "transcribe", "diarize", "memory", "vision"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
